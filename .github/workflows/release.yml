name: Release

on:
  push:
    tags:
      - 'v*'

# Needed to create the GitHub Release and upload the packaged artifact.
permissions:
  contents: write

jobs:
  release:
    name: Package & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm run package` runs scripts/package-xpi.js, which writes
      # dist/danvers-karakeep.xpi (manifest.json, README, LICENSE, src/, icons/).
      - name: Package extension
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/danvers-karakeep.xpi
